[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "corpuskit"
version = "0.1.0"
description = "Turn messy Chinese documents (PDFs) into a clean, traceable knowledge base."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "cjkfold>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["corpuskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
